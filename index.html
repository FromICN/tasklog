  <!-- 🎨 제도(製圖) 테마 — 토큰·타이포·컴포넌트 스킨. 반드시 마지막에 로드할 것.
       글꼴은 자체 호스팅이라 CDN을 타지 않는다(오프라인·APK에서도 그대로 나온다). -->
  <link rel="stylesheet" href="fonts/pretendard.css?v=20260809a">
  <link rel="stylesheet" href="theme.css?v=20260817g">
  <script>
    // 자동 로그인/세션 토큰이 있으면 → 새로고침 직후 로그인 게이트가 깜빡이지 않도록
    // 페인트 전에 미리 숨긴다. (자동 로그인이 실패하면 auth.js가 다시 보여줌)
    (function () {
      try {
        var hasToken = false;
        var raw = localStorage.getItem('tasklog-token');
        if (raw) { var t = JSON.parse(raw); hasToken = !!(t && t.access_token && Date.now() < t.expires_at); }
        var autoOn = localStorage.getItem('tasklog-auto-login') === 'true';
        if (hasToken || autoOn) document.documentElement.classList.add('preauth-hide-gate');
      } catch (e) {}
    })();
  </script>
  <script src="https://apis.google.com/js/api.js"></script>

<!-- ===== 🔐 전체화면 로그인 게이트 (로그인 전까지 앱을 덮음) ===== -->
<div id="login-gate" class="login-gate">
  <div class="login-card">
    <h1 class="login-title">로그인</h1>
    <p class="login-subtitle">계정으로 계속하세요</p>
    <button id="gate-google-btn" class="login-google-btn" onclick="handleSignIn()">
      <span class="g-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
      </span> 구글로 로그인
    </button>
    <label class="login-keep">
      <input type="checkbox" id="keep-login" checked> 로그인 상태 유지
    </label>
  </div>
</div>

<div class="app">

  <!-- ===== 66px 사이드바 ===== -->
  <aside class="sidebar" id="sidebar">

    <!-- 상단: 아바타 + 접기/펼치기 -->
    <div class="sidebar-top">
      <div class="avatar-circle" id="sidebar-avatar" title="프로필 / 로그인" onclick="openProfilePanel()">M</div>
    </div>

    <!-- 메뉴 -->
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- JS로 채워짐 -->
    </nav>

    <!-- 하단: 테마 전환 (설정은 상단 HOME 위로 이동) -->
    <div class="sidebar-bottom">
      <button class="tswitch" id="theme-switch" title="테마 변경" onclick="if(typeof toggleDarkMode==='function')toggleDarkMode()" style="display:block;margin:0 auto 10px;"><span></span></button>
    </div>
  </aside>

  <!-- ===== 모바일 드로어용 스크림 (사이드바 뒤 어둡게) ===== -->
  <div class="sidebar-scrim" id="sidebar-scrim" onclick="closeSidebar()"></div>

  <!-- ===== 중앙 + 오른쪽 패널 래퍼 ===== -->
  <div class="content-wrapper">

    <!-- 메인 콘텐츠 -->
    <main class="main-content" id="main-content">

      <!-- 탑바 -->
      <div class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="toggleSidebar()" aria-label="메뉴 열기">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="topbar-title" id="topbar-title">홈</div>
        </div>
        <div class="topbar-right" id="topbar-right">
          <div class="topbar-date" id="topbar-date"></div>
          <!-- 만다라트 연도 선택 슬롯 -->
          <div class="topbar-mdt-year-slot" id="topbar-mdt-year-slot"></div>
          <!-- Habit Tracker 연도 선택 슬롯 -->
          <div class="topbar-habit-year-slot" id="topbar-habit-year-slot"></div>
          <!-- TO-DO(계획된 일정)에서만: 새 Task 버튼 -->
          <button class="btn-primary" id="new-task-btn" onclick="openNewTaskPanel()" style="display:none;">
            <span style="font-size:16px;line-height:1">+</span> Task
          </button>
          <!-- Board 표시 항목 선택 버튼 슬롯 -->
          <div class="topbar-board-slot" id="topbar-board-slot"></div>
          <!-- Work Diary 저장 버튼 슬롯 -->
          <div class="topbar-journal-slot" id="topbar-journal-slot"></div>
        </div>
      </div>

      <!-- 페이지 콘텐츠 영역 -->
      <div id="page-content" style="flex:1;overflow-y:auto;">
        <!-- JS로 채워짐 -->
      </div>

    </main>

    <!-- ===== 오른쪽 패널 ===== -->
    <div class="right-panel" id="right-panel">
      <div class="rp-header">
        <span class="rp-title" id="rp-title">새 Task 생성</span>
        <button class="rp-close" onclick="closeRightPanel()">✕</button>
      </div>
      <div class="rp-body" id="rp-body">
        <!-- JS로 채워짐 -->
      </div>
      <div class="rp-footer">
        <button class="btn-primary" onclick="saveRightPanel()">저장</button>
        <button class="btn-secondary" onclick="closeRightPanel()">취소</button>
      </div>
    </div>

  </div><!-- .content-wrapper -->

</div><!-- .app -->
